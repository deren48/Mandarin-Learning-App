<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#F6F2EA"/>
<title>Mandarin Lab — Full Demo</title>
<style>
:root{--bg:#F6F2EA;--surface:#fff;--soft:#EEE8DE;--soft2:#E4F3ED;--text:#16202B;--muted:#71808E;--jade:#1D8F6A;--jade2:#D7EFE6;--blue:#5C82D8;--red:#CC5B52;--orange:#E29A48;--purple:#8568D6;--border:#E4DED4;--shadow:0 16px 42px rgba(37,42,49,.08);--nav:rgba(255,255,255,.88)}
[data-theme="dark"]{--bg:#111418;--surface:#191E23;--soft:#232A31;--soft2:#18372F;--text:#F3F6F8;--muted:#A8B2BC;--jade:#38B68E;--jade2:#18372F;--blue:#7AA6FF;--red:#E77B71;--orange:#F1AD63;--purple:#AA93F5;--border:#2C343D;--shadow:0 16px 42px rgba(0,0,0,.26);--nav:rgba(25,30,35,.92)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:470px;margin:0 auto;min-height:100dvh;padding:18px 18px 104px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.02em}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,var(--jade),#71C9A9);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:var(--shadow)}.top-actions{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow)}h1,h2,h3,p{margin:0}h1{font-size:29px;line-height:1.12;letter-spacing:-.035em}h2{font-size:21px;letter-spacing:-.02em}h3{font-size:16px}.muted{color:var(--muted)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.11em;font-weight:900;color:var(--jade)}.screen{display:none}.screen.active{display:block}.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--soft);padding:7px 10px;font-size:12px;font-weight:800}.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:17px;box-shadow:var(--shadow)}.daily{background:linear-gradient(145deg,var(--surface),var(--jade2));padding:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:grid;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tag{border-radius:999px;background:var(--soft);padding:7px 10px;font-size:12px;font-weight:800}.tag.jade{background:var(--jade2);color:var(--jade)}.btn{border:0;border-radius:15px;padding:13px 15px;font-weight:900}.btn.primary{background:var(--jade);color:#fff}.btn.secondary{background:var(--soft);color:var(--text)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}.btn.full{width:100%}.btn.danger{background:color-mix(in srgb,var(--red) 15%,var(--surface));color:var(--red)}.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--jade);border-radius:99px}.metric{font-size:26px;font-weight:950;letter-spacing:-.04em}.click{transition:.16s transform,.16s border-color}.click:active{transform:scale(.985)}.nav{position:fixed;z-index:40;left:50%;bottom:0;transform:translateX(-50%);width:min(470px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 10px calc(10px + env(safe-area-inset-bottom));background:var(--nav);backdrop-filter:blur(20px);border-top:1px solid var(--border)}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 2px;border-radius:12px;font-size:11px;font-weight:850}.nav .ico{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:var(--jade2);color:var(--jade)}.week{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid transparent;border-radius:16px}.week+.week{margin-top:7px}.week.current{background:var(--jade2);border-color:color-mix(in srgb,var(--jade) 35%,var(--border))}.week.locked{opacity:.52}.weeknum{width:39px;height:39px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-weight:950;flex:none}.week.current .weeknum{background:var(--jade);color:white}.skill{display:flex;gap:12px;align-items:center;padding:15px;border:1px solid var(--border);background:var(--surface);border-radius:17px}.skill .ico2{width:43px;height:43px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:21px}.listitem{padding:14px 0;border-bottom:1px solid var(--border)}.listitem:last-child{border-bottom:0}.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;z-index:70;align-items:flex-end}.sheet-backdrop.open{display:flex}.sheet{width:min(470px,100%);margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}.page{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow:auto}.page.open{display:block}.page-inner{max-width:470px;margin:0 auto;padding:17px 18px 38px}.page-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.page-title{flex:1}.option{width:100%;text-align:left;padding:14px;border:1px solid var(--border);border-radius:15px;background:var(--surface);color:var(--text);font-weight:750}.option.selected{border-color:var(--jade);background:var(--jade2)}.option.correct{border-color:var(--jade);background:var(--jade2)}.option.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 13%,var(--surface))}.feedback{display:none;padding:13px;border-radius:14px;background:var(--jade2);margin-top:12px}.feedback.show{display:block}.big-hanzi{text-align:center;font:900 72px/1.05 "PingFang SC","Noto Sans CJK SC",serif;margin:28px 0 4px}.pinyin{text-align:center;color:var(--jade);font-weight:900;font-size:18px}.center{text-align:center}.divider{height:1px;background:var(--border);margin:15px 0}.daycard{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.daybadge{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-weight:950}.daycard.done .daybadge{background:var(--jade);color:#fff}.daycard.locked{opacity:.5}.switch{display:flex;padding:4px;background:var(--soft);border-radius:13px}.switch button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:10px;font-weight:850}.switch button.active{background:var(--surface);color:var(--text);box-shadow:0 5px 16px rgba(0,0,0,.07)}canvas{width:100%;height:260px;background:var(--soft);border:1px solid var(--border);border-radius:18px;touch-action:none}.tone{height:140px;border-radius:18px;background:linear-gradient(180deg,var(--soft),transparent);position:relative;overflow:hidden;margin-top:14px}.tone svg{width:100%;height:100%}.orb{width:164px;height:164px;border-radius:50%;margin:20px auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#80d9bb 0 12%,var(--jade) 35%,#185c49 80%);box-shadow:0 18px 46px color-mix(in srgb,var(--jade) 35%,transparent);color:white}.orb.live{animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 18px 58px color-mix(in srgb,var(--jade) 55%,transparent)}}.timer{font-size:30px;font-weight:950}.chat{display:grid;gap:9px}.msg{max-width:84%;padding:11px 13px;border-radius:16px}.msg.ai{background:var(--soft)}.msg.me{margin-left:auto;background:var(--jade);color:white}.scenario{padding:15px;border:1px solid var(--border);border-radius:17px;background:var(--surface)}.scenario.active{border-color:var(--jade);background:var(--jade2)}.barrow{display:grid;grid-template-columns:88px 1fr 35px;gap:9px;align-items:center}.memoryword{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}.memoryword:last-child{border-bottom:0}.statusdot{width:9px;height:9px;border-radius:50%;background:var(--jade)}.notice{padding:12px 14px;border:1px dashed var(--border);border-radius:14px;color:var(--muted);font-size:13px}.premium{background:linear-gradient(145deg,#17262B,#214B40);color:#F8FFFC;border:none}.premium .muted{color:#C7D8D1}.lock{font-size:13px;font-weight:900;color:var(--orange)}.toast{position:fixed;z-index:99;left:50%;bottom:100px;transform:translate(-50%,18px);background:#16202B;color:white;padding:11px 14px;border-radius:14px;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){.app,.page-inner{max-width:840px}.nav{max-width:840px}.desktop{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.grid2{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo">中</div><div>Mandarin Lab</div></div>
    <div class="top-actions"><button class="iconbtn" id="premiumBtn" title="Premium">★</button><button class="iconbtn" id="settingsBtn" title="Settings">⚙</button></div>
  </div>
  <main>
    <section id="home" class="screen active"></section>
    <section id="learn" class="screen"></section>
    <section id="practice" class="screen"></section>
    <section id="ai" class="screen"></section>
    <section id="progress" class="screen"></section>
  </main>
</div>
<nav class="nav" id="nav"></nav>
<div class="page" id="page"><div class="page-inner" id="pageInner"></div></div>
<div class="sheet-backdrop" id="sheet"><div class="sheet" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state=JSON.parse(localStorage.getItem('mandarinLabState')||'null')||{theme:'system',pinyin:'new',premium:false,streak:8,completedDays:4,lessonStep:0,words:86,hanzi:42,minutes:138,aiUsed:0,mistakes:12,sound:true,audioSpeed:'normal',skill:{Listening:71,Speaking:58,Reading:76,Writing:49,Grammar:67}};
if(state.sound===undefined)state.sound=true;
if(!state.audioSpeed)state.audioSpeed='normal';
const save=()=>localStorage.setItem('mandarinLabState',JSON.stringify(state));
function applyTheme(){let t=state.theme;if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}
applyTheme();

let zhVoice=null;
function loadMandarinVoice(){
  if(!('speechSynthesis' in window))return;
  const voices=window.speechSynthesis.getVoices();
  zhVoice=voices.find(v=>/^zh-CN$/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang))||null;
}
if('speechSynthesis' in window){
  loadMandarinVoice();
  window.speechSynthesis.addEventListener?.('voiceschanged',loadMandarinVoice);
}
function speakMandarin(text,opts={}){
  if(!state.sound){toast('Sound is off — turn it on in Settings');return false}
  if(!('speechSynthesis' in window)){toast('Audio TTS is not supported in this browser');return false}
  loadMandarinVoice();
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';
  u.rate=opts.slow?0.62:(state.audioSpeed==='slow'?0.68:0.90);
  u.pitch=1;
  u.volume=1;
  if(zhVoice)u.voice=zhVoice;
  u.onerror=()=>toast('Could not play Mandarin voice on this device');
  window.speechSynthesis.speak(u);
  return true;
}
function stopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}

const weeks=['Mandarin Foundations','Greetings & Personal Information','People & Family','Numbers, Time & Daily Events','Objects, Quantities & Shopping','Social Chinese & Polite Interaction','Food & Eating','Places & Transportation','Study, School & Work','Hobbies, Weather & Leisure','Health & Survival Chinese','Integration + HSK 1 Final Assessment'];
const weekSubs=['Pinyin · initials/finals · tones','Hello · names · identity','Family · ownership · people','Numbers · date · time · routine','Objects · measure words · prices','Please · thanks · needs','Food · ordering · quantities','Places · where · transportation','Campus · class · professions','Hobbies · ability · weather','Body · condition · asking for help','Review · mock · final assessment'];
const days=['Learn','Understand','Produce','Strengthen','Apply','Weekly Checkpoint','Personalized Review'];
const navs=[['home','⌂','Home'],['learn','◎','Learn'],['practice','◫','Practice'],['ai','✦','AI'],['progress','▥','Progress']];
function go(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));$$('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));render(id);scrollTo({top:0,behavior:'smooth'})}
function openPage(title,html,after){$('#page').classList.add('open');$('#pageInner').innerHTML=`<div class="page-top"><button class="iconbtn" onclick="closePage()">←</button><div class="page-title"><div class="eyebrow">Mandarin Lab</div><h2>${title}</h2></div></div>${html}`;if(after)after();}
function closePage(){stopSpeech();$('#page').classList.remove('open')}
function openSheet(html){$('#sheet').classList.add('open');$('#sheetInner').innerHTML=html}
function closeSheet(){$('#sheet').classList.remove('open')}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
$('#nav').innerHTML=navs.map(([id,ico,n])=>`<button data-id="${id}" class="${id==='home'?'active':''}"><span class="ico">${ico}</span>${n}</button>`).join('');$$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.id));
function skillTag(n){return `<span class="tag">${n}</span>`}
function renderHome(){let completed=Math.min(state.completedDays,7);$('#home').innerHTML=`
<div class="hero"><div><div class="eyebrow">HSK 3.0 · HSK 1</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'} 👋</h1><p class="muted" style="margin-top:6px">One focused lesson. Real Mandarin progress.</p></div><div class="pill">🔥 <b>${state.streak}</b> days</div></div>
<div class="desktop"><div class="card daily click" onclick="startDailyLesson()"><div class="row"><div><div class="eyebrow">Today's lesson</div><h2 style="margin-top:4px">Time & Daily Routine</h2></div><span class="pill">18 min</span></div><div class="tags">${skillTag('Listening')}${skillTag('Grammar')}${skillTag('Speaking')}</div><p class="muted">Ask the time, understand a short schedule, and produce your own daily routine.</p><div class="progress" style="margin:16px 0 12px"><span style="width:${state.lessonStep*12.5}%"></span></div><button class="btn primary full">${state.lessonStep?'Resume lesson':'Start Daily Lesson'}</button></div>
<div class="stack"><div class="card click" onclick="openCheckpoint()"><div class="row"><div><div class="muted">Weekly checkpoint</div><b>${completed>=5?'Ready now':'2 days left'}</b></div><span>→</span></div><div class="progress" style="margin-top:11px"><span style="width:${completed/7*100}%"></span></div></div><div class="card click" onclick="openWeakFocus()"><div class="eyebrow">Weak focus</div><h3 style="margin-top:5px">Tone 3 + Hanzi recall</h3><p class="muted" style="margin-top:5px">Tap for a targeted 5-minute drill.</p></div></div></div>
<div class="section"><div class="sectionhead"><div><div class="eyebrow">Recommended</div><h2>Quick practice</h2></div><button class="btn secondary" onclick="go('practice')">See all</button></div><div class="grid2"><div class="card click" onclick="startPractice('Listening')"><div style="font-size:24px">🎧</div><h3 style="margin-top:8px">Listening sprint</h3><p class="muted">5 min · 6 items</p></div><div class="card click" onclick="startPractice('Speaking')"><div style="font-size:24px">🗣️</div><h3 style="margin-top:8px">Fix Tone 3</h3><p class="muted">3 min · 4 attempts</p></div></div></div>
<div class="section"><div class="sectionhead"><div><div class="eyebrow">Real Chinese</div><h2>Use it outside a textbook</h2></div></div><div class="card click" onclick="openRealChinese()"><div class="row"><div><h3>Campus café menu</h3><p class="muted">Read a realistic menu and order one drink.</p></div><span class="pill">2 min</span></div></div></div>
<div class="section"><div class="sectionhead"><h2>Your momentum</h2><button class="btn secondary" onclick="go('progress')">Details</button></div><div class="grid2"><div class="card"><div class="muted">Words mastered</div><div class="metric">${state.words}</div></div><div class="card"><div class="muted">Hanzi learned</div><div class="metric">${state.hanzi}</div></div><div class="card"><div class="muted">Study time</div><div class="metric">${state.minutes}m</div></div><div class="card"><div class="muted">HSK readiness</div><div class="metric">63%</div></div></div></div>`}
function renderLearn(){let current=4;$('#learn').innerHTML=`<div class="hero"><div><div class="eyebrow">Curriculum</div><h1>HSK 1 Roadmap</h1><p class="muted" style="margin-top:6px">12-week absolute-beginner path, mapped to HSK 3.0.</p></div><div class="pill">31%</div></div><div class="card">${weeks.map((w,i)=>{let n=i+1,locked=n>5&&!state.premium;return `<div class="week click ${n===current?'current':''} ${locked?'locked':''}" onclick="openWeek(${i})"><div class="weeknum">${locked?'🔒':n}</div><div style="flex:1"><b>${w}</b><div class="muted">${weekSubs[i]}</div></div><span>${n===current?'Current':locked?'Premium':'→'}</span></div>`}).join('')}</div><div class="section"><button class="btn primary full" onclick="openTestCenter()">Open Test Center</button></div>`}
function renderPractice(){let skills=[['Listening','🎧','Sound discrimination · dictation'],['Speaking','🗣️','Tone · pronunciation · read aloud'],['Reading','📖','Hanzi → words → sentences'],['Writing','✍️','Trace · guided · recall · dictation'],['Grammar','🧩','Example first · production']];$('#practice').innerHTML=`<div class="hero"><div><div class="eyebrow">Skill gym</div><h1>Practice</h1><p class="muted" style="margin-top:6px">Train a skill without changing curriculum progress.</p></div></div><div class="stack">${skills.map(s=>`<div class="skill click" onclick="startPractice('${s[0]}')"><div class="ico2">${s[1]}</div><div style="flex:1"><b>${s[0]}</b><div class="muted">${s[2]}</div></div><span class="pill">5m</span></div>`).join('')}</div><div class="section"><div class="sectionhead"><h2>Mistake Bank</h2><span class="pill">${state.mistakes} items</span></div><div class="card click" onclick="openMistakeBank()"><div class="row"><div><b>Review what keeps coming back</b><div class="muted">Tone · grammar · vocab · writing</div></div><span>→</span></div></div></div><div class="section"><div class="sectionhead"><h2>Quick durations</h2></div><div class="grid3"><button class="btn secondary" onclick="quickMix(3)">3 min</button><button class="btn secondary" onclick="quickMix(5)">5 min</button><button class="btn secondary" onclick="quickMix(10)">10 min</button></div></div>`}
function renderAI(){let left=(state.premium?3600:600)-state.aiUsed;let m=Math.max(0,Math.floor(left/60));$('#ai').innerHTML=`<div class="hero"><div><div class="eyebrow">AI Conversation</div><h1>Practice room</h1><p class="muted" style="margin-top:6px">Roleplay with language matched to what you’ve learned.</p></div><span class="pill">${state.premium?'Premium':'Free'}</span></div><div class="card"><div class="row"><div><b>Daily conversation time</b><div class="muted">${m} min remaining</div></div><button class="btn secondary" onclick="openPremium()">${state.premium?'Active':'Upgrade'}</button></div><div class="progress" style="margin-top:12px"><span style="width:${Math.max(0,100-state.aiUsed/(state.premium?36:6))}%"></span></div></div><div class="section"><div class="sectionhead"><h2>Choose scenario</h2></div><div class="stack"><div class="scenario click active" onclick="startAI('Café order')"><b>☕ Café order</b><div class="muted">Order a drink and answer one follow-up question.</div></div><div class="scenario click" onclick="startAI('Campus introduction')"><b>🎓 Campus introduction</b><div class="muted">Meet a classmate and introduce yourself.</div></div><div class="scenario click" onclick="startAI('Shopping')"><b>🛍 Shopping</b><div class="muted">Ask the price, quantity, and choose an item.</div></div><div class="scenario click" onclick="startAI('Free conversation')"><b>✦ Free conversation</b><div class="muted">Stay within your current vocabulary band.</div></div></div></div><div class="section"><div class="notice">Demo mode simulates AI/voice interaction locally. A production build would connect speech recognition, tone analysis, and the conversation model.</div></div>`}
function renderProgress(){let avg=Math.round(Object.values(state.skill).reduce((a,b)=>a+b,0)/5);$('#progress').innerHTML=`<div class="hero"><div><div class="eyebrow">Insights</div><h1>Progress</h1><p class="muted" style="margin-top:6px">Exam readiness + actual language ability.</p></div><span class="pill">HSK 1</span></div><div class="card click" onclick="openReadiness()"><div class="row"><div><div class="muted">HSK readiness</div><div class="metric">63%</div></div><div style="text-align:right"><div class="muted">Chinese ability</div><b>${avg}/100</b></div></div><div class="progress" style="margin-top:14px"><span style="width:63%"></span></div></div><div class="section"><div class="sectionhead"><h2>Five skills</h2><span class="muted">Tap for detail</span></div><div class="card">${Object.entries(state.skill).map(([n,v])=>`<div class="barrow click" onclick="openSkill('${n}')" style="margin:13px 0"><b>${n}</b><div class="progress"><span style="width:${v}%;background:${n==='Listening'?'var(--blue)':n==='Speaking'?'var(--red)':n==='Reading'?'var(--jade)':n==='Writing'?'var(--orange)':'var(--purple)'}"></span></div><b>${v}</b></div>`).join('')}</div></div><div class="section"><div class="sectionhead"><h2>Memory strength</h2><button class="btn secondary" onclick="openMemory()">Open map</button></div><div class="card"><div class="memoryword"><span><b>学校</b> <span class="muted">xuéxiào</span></span><span class="pill">Strong</span></div><div class="memoryword"><span><b>现在</b> <span class="muted">xiànzài</span></span><span class="pill">Familiar</span></div><div class="memoryword"><span><b>起床</b> <span class="muted">qǐchuáng</span></span><span class="pill">Learning</span></div></div></div><div class="section"><div class="card click" onclick="openWeakFocus()"><div class="eyebrow">Needs attention</div><h3 style="margin-top:5px">Tone 3 + Hanzi recall</h3><p class="muted" style="margin-top:5px">Your recognition is stronger than speaking and handwriting recall.</p></div></div>`}
function render(id){({home:renderHome,learn:renderLearn,practice:renderPractice,ai:renderAI,progress:renderProgress}[id]||renderHome)()}
renderHome();renderLearn();renderPractice();renderAI();renderProgress();
$('#settingsBtn').onclick=openSettings;$('#premiumBtn').onclick=openPremium;

function openLesson(i){state.lessonStep=i;save();let s=lessonSteps[i],body='';if(s.type==='mcq')body=`<div class="eyebrow">${s.label}</div><h2 style="margin-top:7px">${s.q}</h2>${s.audio?'<button class="btn secondary" id="audioBtn" style="margin-top:15px">▶ Play audio</button>':''}<div class="stack" style="margin-top:16px">${s.opts.map((o,k)=>`<button class="option" data-k="${k}">${o}</button>`).join('')}</div><div class="feedback" id="lessonFb"></div>`;if(s.type==='learn')body=`<div class="eyebrow">${s.label}</div><div class="big-hanzi">${s.hanzi}</div>${state.pinyin!=='off'?`<div class="pinyin">${s.py}</div>`:''}<div class="center muted" style="margin-top:6px">${s.mean}</div><div class="grid2" style="margin-top:16px"><button class="btn secondary" onclick="speakMandarin('${s.hanzi}')">🔊 Hear it</button><button class="btn ghost" onclick="speakMandarin('${s.hanzi}',{slow:true})">🐢 Slower</button></div><div class="card" style="box-shadow:none;margin-top:16px"><b>${s.note}</b><p class="muted" style="margin-top:7px">Use 几点 to ask “what time?” and place a time phrase before the verb.</p></div>`;if(s.type==='speak')body=`<div class="eyebrow">Speaking</div><h2 style="margin-top:7px">Say it aloud</h2><div class="big-hanzi" style="font-size:48px">${s.hanzi}</div>${state.pinyin!=='off'?`<div class="pinyin">${s.py}</div>`:''}<div class="tone"><svg viewBox="0 0 300 120"><path d="M20 70 C70 75,105 85,145 78 S220 35,280 42" fill="none" stroke="var(--jade)" stroke-width="5" stroke-linecap="round"/><path d="M20 92 L280 92" stroke="var(--border)" stroke-dasharray="6 6"/></svg></div><div class="grid2" style="margin-bottom:10px"><button class="btn secondary" onclick="speakMandarin('${s.hanzi}')">🔊 Hear model</button><button class="btn ghost" onclick="speakMandarin('${s.hanzi}',{slow:true})">🐢 Slower</button></div><button class="btn primary full" id="speakDemo">🎙 Start speaking</button><div class="feedback" id="speakFb"></div>`;if(s.type==='write')body=`<div class="eyebrow">Writing</div><h2 style="margin-top:7px">Write ${s.hanzi}</h2><p class="muted" style="margin:5px 0 13px">Use your finger or stylus. Try from memory first.</p><canvas id="writeCanvas" width="760" height="520"></canvas><div class="grid2" style="margin-top:10px"><button class="btn secondary" id="clearCanvas">Clear</button><button class="btn ghost" id="guideCanvas">Show guide</button></div>`;if(s.type==='done')body=`<div class="center" style="padding:24px 0"><div style="font-size:60px">✓</div><h1>Lesson complete</h1><p class="muted" style="margin-top:8px">Time phrases are now connected across listening, speaking, grammar, reading and writing.</p><div class="grid2" style="margin-top:20px"><div class="card"><div class="muted">Accuracy</div><div class="metric">86%</div></div><div class="card"><div class="muted">XP</div><div class="metric">+42</div></div></div></div>`;

function setupLesson(i){let s=lessonSteps[i],selected=null;if(s.type==='mcq'){$$('.option[data-k]').forEach(o=>o.onclick=()=>{$$('.option[data-k]').forEach(x=>x.classList.remove('selected'));o.classList.add('selected');selected=+o.dataset.k});let a=$('#audioBtn');if(a)a.onclick=()=>{speakMandarin('现在三点。');a.textContent='🔊 Playing Mandarin…';setTimeout(()=>a.textContent='▶ Play audio',1700)}}if(s.type==='speak'){$('#speakDemo').onclick=()=>{let b=$('#speakDemo');b.textContent='Listening…';setTimeout(()=>{b.textContent='✓ Recorded';$('#speakFb').classList.add('show');$('#speakFb').innerHTML='<b>Good rhythm.</b><br><span class="muted">Tone 3 on 几 is a little flat. Try a clearer dip before rising.</span>'},1200)}}if(s.type==='write')setupCanvas();$('#lessonNext').onclick=()=>{if(s.type==='mcq'&&selected===null){toast('Choose an answer first');return}if(s.type==='mcq'){let opts=$$('.option[data-k]');opts.forEach((o,k)=>{o.classList.toggle('correct',k===s.correct);o.classList.toggle('wrong',k===selected&&k!==s.correct)});let fb=$('#lessonFb');fb.classList.add('show');fb.textContent=selected===s.correct?'Correct — nice.':'Not quite. The correct answer is highlighted.';setTimeout(()=>{state.lessonStep=i+1;save();openLesson(i+1)},700);return}if(s.type==='done'){state.lessonStep=0;state.completedDays=Math.min(7,state.completedDays+1);state.words+=3;state.hanzi+=1;state.minutes+=18;save();closePage();go('home');toast('Lesson completed');return}state.lessonStep=i+1;save();openLesson(i+1)}}
function setupCanvas(){let c=$('#writeCanvas');if(!c)return;let ctx=c.getContext('2d'),draw=false;ctx.lineWidth=10;ctx.lineCap='round';ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();const pos=e=>{let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}};c.onpointerdown=e=>{draw=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!draw)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=c.onpointerleave=()=>draw=false;$('#clearCanvas').onclick=()=>ctx.clearRect(0,0,c.width,c.height);$('#guideCanvas').onclick=()=>{ctx.save();ctx.globalAlpha=.16;ctx.font='360px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();ctx.fillText('点',c.width/2,c.height/2);ctx.restore()}}

  let[q,opts,correct]=content;openPage(`${skill} Practice`,`<div class="card"><div class="eyebrow">Quick drill</div><h2 style="margin-top:6px">${q}</h2><div class="stack" style="margin-top:15px">${opts.map((o,i)=>`<button class="option" onclick="practiceAnswer(this,${i===correct},'${skill}')">${o}</button>`).join('')}</div><div class="feedback" id="practiceFb"></div></div>`)

function practiceAnswer(el,correct,skill){$$('.option').forEach(x=>x.disabled=true);el.classList.add(correct?'correct':'wrong');let fb=$('#practiceFb');fb.classList.add('show');fb.textContent=correct?'Correct. Nice work.':'Not quite — this item has been added to your Mistake Bank.';if(!correct)state.mistakes++;state.skill[skill]=Math.min(100,state.skill[skill]+(correct?1:0));save();setTimeout(()=>{closePage();renderPractice();toast('Practice saved')},900)}

let aiTimer=null,aiSecs=0;function startAI(scenario){let limit=state.premium?3600:600,left=Math.max(0,limit-state.aiUsed);if(!left){openPremium();return}aiSecs=Math.min(left,90);const first='你好！你想喝什么？';openPage(`AI · ${scenario}`,`<div class="card"><div class="orb live" id="orb"><div class="center"><div class="timer" id="aiTimer">${Math.floor(aiSecs/60)}:${String(aiSecs%60).padStart(2,'0')}</div><div style="font-weight:850">Listening</div></div></div><div class="chat" id="chat"><div class="msg ai">你好！你想喝什么？<br><span class="muted">Nǐ hǎo! Nǐ xiǎng hē shénme?</span></div></div><div class="grid2" style="margin-top:12px"><button class="btn secondary" onclick="speakMandarin('你好！你想喝什么？')">🔊 Replay AI</button><button class="btn ghost" onclick="speakMandarin('你好！你想喝什么？',{slow:true})">🐢 Slower</button></div><div class="grid2" style="margin-top:14px"><button class="btn secondary" onclick="aiReply('我想喝咖啡。')">我想喝咖啡。</button><button class="btn secondary" onclick="aiReply('我要一杯茶。')">我要一杯茶。</button></div><button class="btn ghost full" style="margin-top:10px" onclick="finishAI()">End conversation</button></div>`,()=>{aiTimer=setInterval(()=>{aiSecs--;state.aiUsed++;save();let el=$('#aiTimer');if(el)el.textContent=`${Math.floor(aiSecs/60)}:${String(aiSecs%60).padStart(2,'0')}`;if(aiSecs<=0)finishAI()},1000)});speakMandarin(first)}

function finishAI(){if(aiTimer){clearInterval(aiTimer);aiTimer=null}openPage('Conversation Report',`<div class="card"><div class="eyebrow">Top 3 insights</div><div class="listitem"><b>1 · Tone</b><div class="muted">Tone 3 needs a clearer dip in 很.</div></div><div class="listitem"><b>2 · Grammar</b><div class="muted">我要一杯… is natural for ordering.</div></div><div class="listitem"><b>3 · Vocabulary</b><div class="muted">You used 咖啡 correctly and spontaneously.</div></div><button class="btn primary full" style="margin-top:14px" onclick="startPractice('Speaking')">Practice my mistakes</button></div>`)}
function openSkill(n){let v=state.skill[n];openPage(`${n} Detail`,`<div class="card"><div class="row"><div><div class="muted">Current score</div><div class="metric">${v}</div></div><span class="pill">HSK 1</span></div><div class="progress" style="margin-top:14px"><span style="width:${v}%"></span></div></div><div class="section"><div class="card"><div class="eyebrow">What this means</div><h3 style="margin-top:6px">${n==='Speaking'?'You can produce basic phrases, but tone consistency is your main limiter.':n==='Writing'?'Recognition is ahead of handwritten recall.':'You are progressing steadily at your current HSK band.'}</h3><button class="btn primary full" style="margin-top:14px" onclick="startPractice('${n}')">Practice ${n}</button></div></div>`)}
function openReadiness(){openPage('HSK Readiness',`<div class="grid2"><div class="card"><div class="muted">Listening</div><div class="metric">68%</div></div><div class="card"><div class="muted">Reading</div><div class="metric">72%</div></div><div class="card"><div class="muted">Grammar</div><div class="metric">61%</div></div><div class="card"><div class="muted">Overall</div><div class="metric">63%</div></div></div><div class="section"><div class="card"><div class="eyebrow">Next milestone</div><h3 style="margin-top:6px">Reach 75%+ across core test skills before the HSK 1 final assessment.</h3><button class="btn primary full" style="margin-top:14px" onclick="openTestCenter()">Open Test Center</button></div></div>`)}
function openMemory(){openPage('Memory Map',`<div class="card"><div class="memoryword"><span><b>学校</b><div class="muted">Reading ✓ · Meaning ✓ · Speaking △ · Writing △</div></span><span class="pill">Strong</span></div><div class="memoryword"><span><b>现在</b><div class="muted">Reading ✓ · Meaning ✓ · Speaking ✓ · Writing —</div></span><span class="pill">Familiar</span></div><div class="memoryword"><span><b>起床</b><div class="muted">Reading ✓ · Meaning △ · Speaking △ · Writing —</div></span><span class="pill">Learning</span></div><div class="memoryword"><span><b>几点</b><div class="muted">Reading ✓ · Meaning ✓ · Speaking △ · Writing △</div></span><span class="pill">Learning</span></div></div><div class="section"><button class="btn primary full" onclick="openWeakFocus()">Review weak memories</button></div>`)}
</script>
